<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Central Green — operação de TI: chamados, demandas, cronograma, ativos e conhecimento."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0A1410" />
    <title>Central Green — Operação de TI</title>

    <!-- O "G" é retrato, então vai embutido num SVG quadrado sobre o carvão
         da marca, que garante contraste na aba clara e na escura. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Estilo da tela de carregamento, embutido de propósito.
         O CSS da aplicação chega junto com o bundle; até lá este bloco seria
         texto cru encostado no topo da página. Inline, ele já nasce pronto no
         primeiro paint, sem depender de nada. -->
    <style>
      :root {
        --boot-fundo: #f4f7f4;
        --boot-arco: #0b7a45;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-tema="claro"]) {
          --boot-fundo: #070a08;
          --boot-arco: #35c77f;
        }
      }
      :root[data-tema="escuro"] {
        --boot-fundo: #070a08;
        --boot-arco: #35c77f;
      }

      html,
      body {
        margin: 0;
        background: var(--boot-fundo);
      }

      .boot {
        display: grid;
        place-items: center;
        align-content: center;
        min-height: 100vh;
        background: var(--boot-fundo);
        /* Só aparece se a carga passar de 300ms. Numa carga rápida ninguém vê
           um lampejo de tela de espera, que incomoda mais do que informa. */
        opacity: 0;
        animation: boot-surge 0.25s ease 0.3s forwards;
      }

      .boot__anel {
        position: relative;
        display: grid;
        place-items: center;
        width: 86px;
        height: 86px;
        color: var(--boot-arco);
      }

      /* O Spinner do DS: trilha é o círculo INTEIRO na mesma cor a 20%, e por
         cima gira um quarto de volta com ponta arredondada. O anel de `border`
         que havia aqui não faz ponta arredondada, e a trilha era uma segunda
         cor que só existia para isto. */
      .boot__giro {
        position: absolute;
        inset: 0;
        width: 86px;
        height: 86px;
        animation: boot-gira 0.9s linear infinite;
      }

      /* Sob o anel, não dentro dele: a marca não gira junto. */
      .boot img {
        position: relative;
        animation: boot-pulso 1.8s ease-in-out infinite;
      }

      @keyframes boot-surge {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-gira {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-pulso {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }

      /* Sem movimento o anel fica inteiro no verde claro: ainda se lê como
         espera, sem girar. */
      @media (prefers-reduced-motion: reduce) {
        .boot {
          opacity: 1;
          animation: none;
        }
        .boot__giro {
          animation: none;
        }
        .boot img {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" aria-busy="true">
      <!-- Sem legenda escrita: o giro já diz que está carregando, e o
           `role="status"` com `aria-label` mantém o aviso para quem usa leitor
           de tela. -->
      <div class="boot" role="status" aria-label="Carregando a Central Green">
        <div class="boot__anel">
          <svg class="boot__giro" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle
              cx="12" cy="12" r="9"
              stroke="currentColor" stroke-width="3" opacity="0.2"
            />
            <path
              d="M21 12a9 9 0 0 0-9-9"
              stroke="currentColor" stroke-width="3" stroke-linecap="round"
            />
          </svg>
          <img src="/igreen-g.png" alt="" width="30" height="40" />
        </div>
      </div>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
